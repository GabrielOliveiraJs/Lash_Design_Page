<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>May Souza Beauty - Início</title>
    <script
      src="https://kit.fontawesome.com/0c2e64d2bb.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo-container">
          <img
            class="logo"
            src="images/logo.jpeg"
            alt="Logo de May Souza Beauty"
          />
        </div>
        <ul class="navigation-list">
          <li class="navigation-item">
            <a class="navigation-link" href="#">Início</a>
          </li>
          <li class="navigation-item">
            <a class="navigation-link" href="#">Sobre</a>
          </li>
          <li class="navigation-item">
            <a class="navigation-link" href="#">Serviços</a>
          </li>
          <li class="navigation-item">
            <a class="navigation-link" href="#">Produtos</a>
          </li>
          <li class="navigation-item">
            <a class="navigation-link" href="#">Contato</a>
          </li>

          <!-- CTA Mobile -->
          <li class="mobile-cta">
            <button class="cta-button">
              Agendar Atendimento
              <i class="fa-regular fa-calendar-days"></i>
            </button>
          </li>
        </ul>

        <!-- CTA Desktop -->
        <button class="cta-button desktop-cta">
          Agendar Atendimento
          <i class="fa-regular fa-calendar-days"></i>
        </button>

        <!-- Botão Toggle Navbar -->
        <button class="menu-toggle" aria-label="Abrir menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </nav>
    </header>
    <h1>May Souza Beauty</h1>
    <p>Lorem ipsum dolor sit amet.</p>
  </body>
  <script src="script.js"></script>
</html>
